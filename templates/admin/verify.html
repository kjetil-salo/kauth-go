<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>kauth Admin</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            margin: 0; min-height: 100vh;
            background: url('/static/viking-door.jpg') center/cover no-repeat fixed;
            display: flex; align-items: center; justify-content: center;
        }
        .card { background: transparent; border-radius: 12px; padding: 2.5rem 2rem; width: 100%; max-width: 380px; margin: 1rem; }
        .logo { text-align: center; margin-bottom: 1.5rem; }
        .logo h1 { font-size: 1.5rem; font-weight: 700; color: #f1f5f9; margin: 0; text-shadow: 0 1px 4px rgba(0,0,0,.7); }
        .logo p { font-size: .9rem; color: #cbd5e1; margin: .5rem 0 0; line-height: 1.5; text-shadow: 0 1px 3px rgba(0,0,0,.7); }
        button[type=submit] {
            display: block; width: 100%; padding: .7rem; border: 1px solid rgba(255,255,255,.15);
            border-radius: 6px; font-size: .95rem; cursor: pointer; font-weight: 500;
            background: rgba(15,23,42,.75); color: #e2e8f0;
        }
        button[type=submit]:hover { background: rgba(15,23,42,.9); border-color: rgba(255,255,255,.3); }
        .msg { padding: .6rem .75rem; border-radius: 6px; margin-bottom: 1rem; text-align: center; font-size: .9rem; color: #dc2626; background: #fef2f2; }
        .back { display: block; text-align: center; margin-top: 1rem; color: #cbd5e1; font-size: .9rem; text-decoration: none; text-shadow: 0 1px 3px rgba(0,0,0,.7); }
        .back:hover { color: #f1f5f9; }
    </style>
</head>
<body>
<div class="card">
    <div class="logo">
        <h1>kauth Admin</h1>
        {{if not .Blocked}}<p>Trykk «Logg inn» for å fullføre. Lenken virker bare én gang.</p>{{end}}
    </div>
    {{if .Blocked}}
    <div class="msg" role="alert">Innloggingen kunne ikke fullføres her. Kopier lenken fra e-posten og lim den inn i nettleseren.</div>
    <a href="/admin/login" class="back">Tilbake til innlogging</a>
    {{else}}
    <form method="post" action="/admin/verify">
        <input type="hidden" name="token" value="{{.Token}}">
        <button type="submit">Logg inn</button>
    </form>
    {{end}}
</div>
</body>
</html>
